# ==============================================================================
# DATASOURCE — sobreescrito por @DynamicPropertySource en PostgresContainerTest
# ==============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA — crea el schema desde las entidades al iniciar el test y lo borra al final
# (Flyway deshabilitado acá a propósito: no tiene sentido correr las migraciones
# reales sobre un schema efímero que Hibernate ya recrea desde las entidades)
# ==============================================================================
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================================================================
# JWT
# ==============================================================================
jwt.secret=CLAVE_SECRETA_PARA_TESTS_DE_INTEGRACION_CON_TESTCONTAINERS

# ==============================================================================
# PASSWORD
# ==============================================================================
auth.password.vencimiento-dias-global=90

# ==============================================================================
# CORS
# ==============================================================================
cors.allowed-origin-patterns=*

# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.root=WARN
logging.level.ar.com.solaresdedonato=INFO
logging.level.org.hibernate.SQL=WARN
