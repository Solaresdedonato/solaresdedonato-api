# ==============================================================================
# CONFIGURACION DE LA APLICACION
# ==============================================================================
spring.application.name=solares-donato-api
server.port=${PORT:8081}
server.servlet.context-path=/solares-donato

# ==============================================================================
# SECRETOS LOCALES — archivo opcional y gitignoreado (ver .gitignore /
# local.properties.example). En Railway estos mismos valores vienen de env vars,
# que pisan lo que haya acá; no hace falta el archivo fuera de la notebook.
# ==============================================================================
spring.config.import=optional:file:./local.properties

# ==============================================================================
# JPA / FLYWAY
# ==============================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# DATASOURCE POSTGRES
# ==============================================================================
# El default apunta al docker-compose.yml local; username/password no llevan
# default a propósito, para que falte configurarlos falle el arranque en vez de
# levantar silenciosamente con una credencial adivinada.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solaresdedonato}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ==============================================================================
# STORAGE LOCAL (fotos/portadas de contenido_media — sin AWS/S3, ver plan de diseño)
# ==============================================================================
app.storage.local.base-dir=${APP_STORAGE_BASE_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Mismo límite que spring.servlet.multipart.max-file-size, pero explícito en bytes:
# multipart.max-file-size NO aplica a una descarga de Google Drive, así que
# ValidadorArchivoImagen lo re-chequea a mano en los dos caminos (multipart y Drive).
app.storage.max-file-size-bytes=${APP_STORAGE_MAX_FILE_SIZE_BYTES:20971520}

# ==============================================================================
# GOOGLE DRIVE (ingesta de fotos; Drive NO es hosting, ver plan de diseño)
# ==============================================================================
# credentials-json sin default: si falta, GoogleDriveArchivoExternoAdapter cae a
# GoogleCredentials.getApplicationDefault() (útil en la notebook con
# GOOGLE_APPLICATION_CREDENTIALS). folder-id es server-side y fijo — el endpoint de
# listado NO lo recibe del cliente.
app.drive.credentials-json=${GOOGLE_DRIVE_CREDENTIALS_JSON:}
app.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}
app.drive.application-name=solares-donato-api
app.drive.page-size-max=100

# ==============================================================================
# HIKARICP
# ==============================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==============================================================================
# JWT — sin default: si falta, que la app no arranque en vez de emitir tokens
# firmados con una clave conocida.
# ==============================================================================
jwt.secret=${JWT_SECRET}

# ==============================================================================
# CORS — el default sirve al frontend local (Vite en :5173); producción está
# obligada a declarar su propio dominio vía env var, no hay profile que lo pise.
# ==============================================================================
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}

# ==============================================================================
# PASSWORD
# ==============================================================================
auth.password.vencimiento-dias-global=${AUTH_PASSWORD_VENCIMIENTO_DIAS:90}

# ==============================================================================
# ACTUATOR
# ==============================================================================
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=solares-donato-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==============================================================================
# SPRINGDOC / SWAGGER
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# ==============================================================================
# LOGGING
# ==============================================================================
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
logging.level.root=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.security=WARN

# ==============================================================================
# TASK EXECUTION & SCHEDULING SHUTDOWN
# ==============================================================================
management.tracing.enabled=false

spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=60s
